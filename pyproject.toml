[project]
name = "coreframe-comply"
version = "0.1.0"
description = "Turn retailer routing guides into cited, checkable rules and flag shipment violations before they ship."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coreframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
